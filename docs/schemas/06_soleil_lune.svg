  <text x="560" y="188" font-size="13" fill="#4A5468">phase = (0,25 + t) mod 1</text>

  <!-- ticks -->
  <g font-size="13" fill="#0B1424" text-anchor="middle">
    <line x1="300" y1="224" x2="300" y2="236" stroke="#9AA6BE"/>
    <line x1="500" y1="224" x2="500" y2="236" stroke="#9AA6BE"/>

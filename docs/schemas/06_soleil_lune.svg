<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#3D9BF0"/>
      <stop offset="0.25" stop-color="#FFA86B"/>
      <stop offset="0.5" stop-color="#040A22"/>
      <stop offset="0.75" stop-color="#FFA86B"/>
      <stop offset="1" stop-color="#3D9BF0"/>
    </linearGradient>
    <radialGradient id="sun"><stop offset="0" stop-color="#FFFDE7"/><stop offset="0.6" stop-color="#FFD54F"/><stop offset="1" stop-color="#FFB300"/></radialGradient>
    <radialGradient id="moon" cx="0.35" cy="0.35"><stop offset="0" stop-color="#FFFFF4"/><stop offset="1" stop-color="#DCDAC4"/></radialGradient>
  </defs>
  <rect width="1000" height="440" fill="#fff"/>
  <text x="40" y="34" font-size="20" font-weight="700" fill="#0B1424">Cycle soleil / lune : une valeur t de 0 à 1 = une journée</text>

  <!-- sky band -->
  <rect x="100" y="56" width="800" height="40" rx="8" fill="url(#sky)"/>
  <circle cx="100" cy="76" r="13" fill="url(#sun)"/>
  <circle cx="300" cy="76" r="11" fill="url(#sun)"/>
  <circle cx="500" cy="76" r="12" fill="url(#moon)"/>
  <circle cx="700" cy="76" r="11" fill="url(#sun)"/>
  <circle cx="900" cy="76" r="13" fill="url(#sun)"/>

  <!-- axes -->
  <line x1="100" y1="230" x2="910" y2="230" stroke="#9AA6BE" stroke-width="1.5"/>
  <line x1="100" y1="120" x2="100" y2="340" stroke="#9AA6BE" stroke-width="1.5"/>
  <text x="90" y="135" font-size="13" fill="#4A5468" text-anchor="end">+1 jour</text>
  <text x="90" y="234" font-size="13" fill="#4A5468" text-anchor="end">0</text>
  <text x="90" y="335" font-size="13" fill="#4A5468" text-anchor="end">−1 nuit</text>
  <line x1="100" y1="130" x2="900" y2="130" stroke="#E3E7EF" stroke-dasharray="4 4"/>
  <line x1="100" y1="330" x2="900" y2="330" stroke="#E3E7EF" stroke-dasharray="4 4"/>


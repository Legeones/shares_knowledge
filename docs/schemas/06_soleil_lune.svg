    <text x="100" y="364" font-weight="700">t = 0</text><text x="100" y="382">midi</text>
    <text x="300" y="364" font-weight="700">t = 0,25</text><text x="300" y="382">coucher</text>
    <text x="500" y="364" font-weight="700">t = 0,5</text><text x="500" y="382">minuit</text>
    <text x="700" y="364" font-weight="700">t = 0,75</text><text x="700" y="382">lever</text>
    <text x="900" y="364" font-weight="700">t = 1</text><text x="900" y="382">midi</text>
  </g>

  <text x="40" y="422" font-size="14" fill="#0B1424"><tspan font-weight="700">+1 jour / +7 jours / +1 mois</tspan> : forward(from: 0), un tour en 0,6 / 0,9 / 1,2 s   ·   <tspan font-weight="700">Lecture</tspan> : repeat()   ·   <tspan font-weight="700">Pause</tspan> : forward(), finit le tour à midi</text>
</svg>

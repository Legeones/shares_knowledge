<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#003891"/></marker>
  </defs>
  <style>
    .p{fill:#E4ECFF;stroke:#1F5EFF;stroke-width:1.5}
    .d{fill:#FFF6E0;stroke:#E0A21B;stroke-width:1.5}
    .ok{fill:#E3F6EE;stroke:#0F9D6B;stroke-width:1.5}
    .ko{fill:#FDECEC;stroke:#E5484D;stroke-width:1.5}
    .t{font-size:14px;fill:#0B1424}
    .b{font-size:14px;fill:#0B1424;font-weight:700}
    .l{font-size:13px;fill:#003891;font-weight:700}
    .w{stroke:#003891;stroke-width:2;fill:none}
  </style>
  <rect width="1000" height="600" fill="#fff"/>
  <text x="40" y="34" font-size="20" font-weight="700" fill="#0B1424">Cache des cours : PriceRepository.getDailySeries()</text>

  <rect class="p" x="330" y="56" width="300" height="52" rx="26"/>
  <text class="b" x="480" y="78" text-anchor="middle">Demande : symbole, début, fin</text>
  <text class="t" x="480" y="98" text-anchor="middle" font-size="12">fin limitée à hier (cours du jour non définitif)</text>

  <polygon class="d" points="480,138 640,186 480,234 320,186"/>
  <text class="b" x="480" y="182" text-anchor="middle">Période déjà</text>
  <text class="b" x="480" y="200" text-anchor="middle">couverte ?</text>
  <text x="650" y="190" font-size="12" fill="#4A5468">table price_coverage</text>

  <rect class="ok" x="40" y="160" width="220" height="52" rx="10"/>
  <text class="b" x="150" y="182" text-anchor="middle">Lecture SQLite</text>
  <text class="t" x="150" y="201" text-anchor="middle" font-size="12">aucune requête réseau</text>

  <rect class="p" x="330" y="280" width="300" height="56" rx="10"/>
  <text class="b" x="480" y="303" text-anchor="middle">Télécharger seulement</text>
  <text class="t" x="480" y="322" text-anchor="middle">les jours manquants (avant / après)</text>

  <polygon class="d" points="480,364 600,404 480,444 360,404"/>
  <text class="b" x="480" y="409" text-anchor="middle">Réponse ?</text>

  <rect class="ok" x="700" y="374" width="260" height="60" rx="10"/>
  <text class="b" x="830" y="398" text-anchor="middle">Enregistrer (transaction)</text>
  <text class="t" x="830" y="418" text-anchor="middle" font-size="12">étendre la couverture, puis lire SQLite</text>

  <polygon class="d" points="480,472 620,514 480,556 340,514"/>
  <text class="b" x="480" y="510" text-anchor="middle">Cours en cache</text>
  <text class="b" x="480" y="528" text-anchor="middle">sur la période ?</text>

  <rect class="ok" x="700" y="484" width="260" height="60" rx="10"/>
  <text class="b" x="830" y="508" text-anchor="middle">Afficher le cache</text>
  <text class="t" x="830" y="527" text-anchor="middle" font-size="12">isFallback + date de téléchargement</text>

  <rect class="ko" x="40" y="488" width="220" height="52" rx="10"/>
  <text class="b" x="150" y="510" text-anchor="middle">Erreur à l'écran</text>
  <text class="t" x="150" y="529" text-anchor="middle" font-size="12">message + « Réessayer »</text>

  <!-- arrows -->
  <line class="w" x1="480" y1="108" x2="480" y2="134" marker-end="url(#a)"/>
  <line class="w" x1="320" y1="186" x2="264" y2="186" marker-end="url(#a)"/>
  <text class="l" x="292" y="178" text-anchor="middle">oui</text>
  <line class="w" x1="480" y1="234" x2="480" y2="276" marker-end="url(#a)"/>
  <text class="l" x="494" y="268">non</text>
  <line class="w" x1="480" y1="336" x2="480" y2="360" marker-end="url(#a)"/>
  <line class="w" x1="600" y1="404" x2="696" y2="404" marker-end="url(#a)"/>
  <text class="l" x="648" y="396" text-anchor="middle">reçue</text>
  <line class="w" x1="480" y1="444" x2="480" y2="468" marker-end="url(#a)"/>
  <text class="l" x="494" y="462">pas de réseau / quota</text>
  <line class="w" x1="620" y1="514" x2="696" y2="514" marker-end="url(#a)"/>
  <text class="l" x="658" y="506" text-anchor="middle">oui</text>
  <line class="w" x1="340" y1="514" x2="264" y2="514" marker-end="url(#a)"/>
  <text class="l" x="302" y="506" text-anchor="middle">non</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#003891"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0A8F84"/></marker>
  </defs>
  <style>
    .box{fill:#E4ECFF;stroke:#1F5EFF;stroke-width:1.5}
    .logic{fill:#F5F7FB;stroke:#9AA6BE;stroke-width:1.5}
    .ext{fill:#E0FAF7;stroke:#0A8F84;stroke-width:1.5}
    .t{font-size:16px;font-weight:700;fill:#0B1424}
    .s{font-size:13px;fill:#4A5468}
    .n{font-size:13px;font-weight:700;fill:#fff}
    .l{font-size:13px;fill:#003891}
  </style>
  <rect width="1000" height="520" fill="#fff"/>
  <text x="40" y="34" font-size="20" font-weight="700" fill="#0B1424">Parcours d'une simulation Playground</text>

  <!-- column 1 : écrans -->
  <rect class="box" x="40" y="70" width="210" height="64" rx="12"/>
  <text class="t" x="145" y="98" text-anchor="middle">PlaygroundScreen</text>
  <text class="s" x="145" y="119" text-anchor="middle">formulaire validé</text>

  <rect class="box" x="40" y="370" width="210" height="80" rx="12"/>
  <text class="t" x="145" y="400" text-anchor="middle">SimulationResultScreen</text>
  <text class="t" x="145" y="422" text-anchor="middle">ReplayScreen</text>
  <text class="s" x="145" y="441" text-anchor="middle">résultat, graphique, rejeu</text>

  <!-- column 2 : provider -->
  <rect class="box" x="330" y="200" width="230" height="100" rx="12"/>
  <text class="t" x="445" y="230" text-anchor="middle">PlaygroundProvider</text>
  <text class="s" x="445" y="252" text-anchor="middle">gère les états</text>
  <text class="s" x="445" y="270" text-anchor="middle">Idle, Loading, Success, Failure</text>

  <!-- column 3 -->
  <rect class="box" x="640" y="90" width="200" height="64" rx="12"/>
  <text class="t" x="740" y="118" text-anchor="middle">PriceRepository</text>
  <text class="s" x="740" y="139" text-anchor="middle">cache ou API ?</text>

  <rect class="logic" x="640" y="330" width="200" height="80" rx="12"/>
  <text class="t" x="740" y="358" text-anchor="middle">simulator.dart</text>
  <text class="s" x="740" y="379" text-anchor="middle">+ drawdown, returns</text>
  <text class="s" x="740" y="397" text-anchor="middle">renvoie un SimulationResult</text>

  <!-- externals -->
  <rect class="ext" x="880" y="40" width="100" height="56" rx="10"/>
  <text class="t" x="930" y="64" text-anchor="middle" font-size="14">SQLite</text>
  <text class="s" x="930" y="83" text-anchor="middle" font-size="11">PriceCacheDao</text>
  <rect class="ext" x="880" y="150" width="100" height="56" rx="10"/>
  <text class="t" x="930" y="174" text-anchor="middle" font-size="14">Twelve Data</text>
  <text class="s" x="930" y="193" text-anchor="middle" font-size="11">TwelveDataApi</text>

  <!-- arrows -->
  <path d="M250,102 L290,102 L290,235 L326,235" fill="none" stroke="#003891" stroke-width="2" marker-end="url(#a)"/>
  <path d="M560,225 L600,225 L600,122 L636,122" fill="none" stroke="#003891" stroke-width="2" marker-end="url(#a)"/>
  <path d="M842,110 L860,110 L860,68 L876,68" fill="none" stroke="#0A8F84" stroke-width="2" marker-end="url(#g)"/>
  <path d="M842,134 L860,134 L860,178 L876,178" fill="none" stroke="#0A8F84" stroke-width="2" marker-end="url(#g)"/>
  <path d="M560,275 L600,275 L600,370 L636,370" fill="none" stroke="#003891" stroke-width="2" marker-end="url(#a)"/>
  <path d="M326,280 L290,280 L290,410 L254,410" fill="none" stroke="#003891" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>

  <!-- step numbers -->
  <circle cx="290" cy="168" r="13" fill="#1F5EFF"/><text class="n" x="290" y="173" text-anchor="middle">1</text>
  <text class="l" x="160" y="173" text-anchor="end" font-size="12"> </text>
  <circle cx="600" cy="172" r="13" fill="#1F5EFF"/><text class="n" x="600" y="177" text-anchor="middle">2</text>
  <circle cx="860" cy="90" r="13" fill="#0A8F84"/><text class="n" x="860" y="95" text-anchor="middle">3</text>
  <circle cx="600" cy="322" r="13" fill="#1F5EFF"/><text class="n" x="600" y="327" text-anchor="middle">4</text>
  <circle cx="290" cy="345" r="13" fill="#1F5EFF"/><text class="n" x="290" y="350" text-anchor="middle">5</text>

  <!-- legend -->
  <g font-size="14" fill="#0B1424">
    <text x="40" y="482"><tspan font-weight="700">1</tspan> simulate(params)</text>
    <text x="200" y="482"><tspan font-weight="700">2</tspan> getDailySeries()</text>
    <text x="380" y="482"><tspan font-weight="700">3</tspan> lecture du cache SQLite, sinon téléchargement des jours manquants</text>
    <text x="40" y="506"><tspan font-weight="700">4</tspan> runSimulation() calcule le résultat</text>
    <text x="380" y="506"><tspan font-weight="700">5</tspan> notifyListeners() : les écrans affichent le nouvel état</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#003891"/></marker>
  </defs>
  <style>
    .t{font-size:17px;font-weight:700;fill:#0B1424}
    .s{font-size:13px;fill:#4A5468}
    .l{font-size:13px;fill:#003891}
  </style>
  <rect width="1000" height="350" fill="#fff"/>
  <text x="40" y="34" font-size="20" font-weight="700" fill="#0B1424">États du Playground (sealed class PlaygroundState)</text>

  <rect x="40" y="130" width="170" height="70" rx="35" fill="#F5F7FB" stroke="#9AA6BE" stroke-width="1.5"/>
  <text class="t" x="125" y="160" text-anchor="middle">Idle</text>
  <text class="s" x="125" y="180" text-anchor="middle">rien de lancé</text>

  <rect x="330" y="130" width="190" height="70" rx="35" fill="#E4ECFF" stroke="#1F5EFF" stroke-width="1.5"/>
  <text class="t" x="425" y="160" text-anchor="middle">Loading</text>
  <text class="s" x="425" y="180" text-anchor="middle">indicateur de chargement</text>

  <rect x="660" y="60" width="300" height="80" rx="40" fill="#E3F6EE" stroke="#0F9D6B" stroke-width="1.5"/>
  <text class="t" x="810" y="92" text-anchor="middle">Success</text>
  <text class="s" x="810" y="112" text-anchor="middle">résultat + graphique</text>
  <text class="s" x="810" y="129" text-anchor="middle">isFallback : cache affiché, avec avertissement</text>

  <rect x="660" y="200" width="300" height="80" rx="40" fill="#FDECEC" stroke="#E5484D" stroke-width="1.5"/>
  <text class="t" x="810" y="232" text-anchor="middle">Failure</text>
  <text class="s" x="810" y="252" text-anchor="middle">message lisible</text>
  <text class="s" x="810" y="269" text-anchor="middle">boutons « Réessayer » / « Modifier »</text>

  <line x1="212" y1="165" x2="326" y2="165" stroke="#003891" stroke-width="2" marker-end="url(#a)"/>
  <text class="l" x="269" y="155" text-anchor="middle">Lancer</text>
  <path d="M522,152 C590,152 600,100 656,100" fill="none" stroke="#003891" stroke-width="2" marker-end="url(#a)"/>
  <text class="l" x="560" y="98" text-anchor="middle">cours reçus</text>
  <path d="M522,178 C590,178 600,240 656,240" fill="none" stroke="#003891" stroke-width="2" marker-end="url(#a)"/>
  <text class="l" x="575" y="256" text-anchor="middle">erreur</text>
  <path d="M700,282 C600,320 440,310 425,204" fill="none" stroke="#003891" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text class="l" x="560" y="324" text-anchor="middle">retry()  « Réessayer »</text>
</svg>
